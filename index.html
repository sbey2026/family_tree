<style>
:root{--bg:#ffffff;--ink:#000000;--muted:#3a3a3a;--line:#c9c9c9;--accent:#0b2a5b;--accent-ink:#ffffff;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--ink:#ebeff5;--muted:#b0bacb;--line:#2e3850;--accent:#a3bcf2;--accent-ink:#0e1422;--bad:#f09484;color-scheme:dark}}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{width:min(380px,100%);display:grid;gap:14px}
h1{font:700 28px/1.15 Georgia,"Iowan Old Style",serif;margin:0}
p{margin:0;color:var(--muted)}
label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.row{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.err{color:var(--bad);font-weight:700;min-height:1.5em}
</style></head><body>

<script>
(function(){
  var D = JSON.parse(document.getElementById('lock-data').textContent);
  var u8 = function(b){ var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  var pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  document.getElementById('show').onchange = function(e){ pw.type = e.target.checked ? 'text' : 'password'; };
  document.getElementById('f').onsubmit = async function(e){
    e.preventDefault(); err.textContent = '';
    if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser can’t unlock the tree. Try an up-to-date Chrome, Edge, Firefox or Safari.'; return; }
    go.disabled = true; go.textContent = 'Unlocking…';
    try {
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(pw.value.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct));
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = 'That password isn’t right. Check it and try again.';
      go.disabled = false; go.textContent = 'Open the tree'; pw.select();
    }
  };
})();
</script>
